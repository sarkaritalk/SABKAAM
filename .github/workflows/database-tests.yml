name: SABKAAM database tests

on:
  pull_request:
    branches:
      - main
      - "feature/supabase-schema-migrations"
  push:
    branches:
      - main
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-tests:
    name: Supabase migrations, pgTAP and database lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Run database authorization tests
        run: supabase test db

      - name: Lint local database
        run: supabase db lint --fail-on error

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
